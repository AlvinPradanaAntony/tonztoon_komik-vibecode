<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Dashboard admin TonzToon untuk manajemen akun pengguna."
    />
    <title>TonzToon Account Manager</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
    />
    <link rel="stylesheet" href="./admin-dashboard.css" />
    <script src="./admin-dashboard.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  </head>
  <body>
    <div id="appView" style="min-height:100vh">
      <nav
        data-admin-sidebar
        data-active-module="accounts"
      ></nav>

      <div class="admin-layout">
        <header
          data-admin-header
          data-eyebrow="Supabase"
          data-title="Manajemen Akun"
        >
          <template data-admin-actions>
            <button
              id="reloadBtn"
              type="button"
              class="btn btn-secondary"
              title="Muat ulang akun"
            >
              <i data-lucide="refresh-cw"></i>
              <span>Reload</span>
            </button>
            <button
              id="openCreateBtn"
              type="button"
              class="btn btn-primary"
              title="Tambah akun"
            >
              <i data-lucide="plus"></i>
              <span>Akun</span>
            </button>
          </template>
        </header>

        <main class="main-content">
          <div class="dashboard-grid dashboard-grid-aside">
            <!-- Left Column -->
            <section style="min-width:0" class="space-y-4">
              <!-- Stats -->
              <div class="stats-grid stagger-children">
                <div class="stat-card stat-brand">
                  <div class="stat-row">
                    <span class="stat-label">Total akun</span>
                    <span class="stat-icon icon-brand">
                      <i data-lucide="users"></i>
                    </span>
                  </div>
                  <span id="totalUsers" class="stat-value">0</span>
                </div>
                <div class="stat-card stat-teal">
                  <div class="stat-row">
                    <span class="stat-label">Aktif halaman ini</span>
                    <span class="stat-icon icon-teal">
                      <i data-lucide="user-check"></i>
                    </span>
                  </div>
                  <span id="activeUsers" class="stat-value">0</span>
                </div>
                <div class="stat-card stat-orange">
                  <div class="stat-row">
                    <span class="stat-label">Relasi halaman ini</span>
                    <span class="stat-icon icon-orange">
                      <i data-lucide="link-2"></i>
                    </span>
                  </div>
                  <span id="relationCount" class="stat-value">0</span>
                </div>
              </div>

              <!-- Announcement -->
              <form
                id="announcementForm"
                class="announcement-card"
                style="position:relative;z-index:20"
              >
                <div class="flex items-start justify-between gap-3" style="flex-wrap:wrap">
                  <div class="section-header">
                    <span class="section-eyebrow">Push remote</span>
                    <h2 class="text-lg font-semibold">Kirim pengumuman</h2>
                  </div>
                  <button
                    id="sendAnnouncementBtn"
                    type="submit"
                    class="btn btn-primary"
                  >
                    <i data-lucide="send"></i>
                    <span>Kirim</span>
                  </button>
                </div>
                <div class="form-grid form-grid-2" style="margin-top:16px">
                  <div class="input-group">
                    <label class="input-label" for="announcementTitleField">Judul</label>
                    <input
                      id="announcementTitleField"
                      type="text"
                      required
                      maxlength="120"
                      class="input"
                      placeholder="Maintenance TonzToon"
                    />
                  </div>
                  <div class="input-group">
                    <label class="input-label" for="announcementCategoryField">Kategori</label>
                    <select
                      id="announcementCategoryField"
                      class="select-input"
                    >
                      <option value="Pengumuman">Pengumuman</option>
                      <option value="Maintenance">Maintenance</option>
                      <option value="Testing">Testing</option>
                    </select>
                  </div>
                  <div class="input-group form-span-2">
                    <label class="input-label" for="announcementMessageField">Pesan</label>
                    <textarea
                      id="announcementMessageField"
                      required
                      maxlength="500"
                      rows="3"
                      class="textarea-input"
                      placeholder="Server akan maintenance malam ini pukul 23.00 WIB."
                    ></textarea>
                  </div>
                  <div class="input-group form-span-2">
                    <label class="input-label" for="announcementRouteField">Route saat dibuka</label>
                    <select
                      id="announcementRouteField"
                      class="select-input"
                    >
                      <option value="/notifications">Halaman notifikasi (/notifications)</option>
                      <option value="/">Beranda (/)</option>
                      <option value="/catalog">Katalog (/catalog)</option>
                      <option value="/search">Pencarian (/search)</option>
                      <option value="/library">Pustaka - bookmark (/library)</option>
                      <option value="/library?tab=collections">Pustaka - koleksi (/library?tab=collections)</option>
                      <option value="/library?tab=scenes">Pustaka - scenes (/library?tab=scenes)</option>
                      <option value="/library?tab=history">Pustaka - riwayat (/library?tab=history)</option>
                      <option value="/library?tab=downloads">Pustaka - download (/library?tab=downloads)</option>
                      <option value="/library/continue-reading">Lanjut membaca (/library/continue-reading)</option>
                      <option value="/settings">Pengaturan (/settings)</option>
                      <option value="/auth">Login (/auth)</option>
                      <option value="/auth/forgot-password">Lupa password (/auth/forgot-password)</option>
                    </select>
                  </div>
                </div>
              </form>

              <!-- Users Table -->
              <div class="card card-shadow" style="overflow:hidden;position:relative;z-index:0">
                <div class="table-filters" style="grid-template-columns:minmax(220px,1fr) 160px 160px">
                  <div class="input-search">
                    <i data-lucide="search"></i>
                    <input
                      id="searchInput"
                      type="search"
                      class="input"
                      placeholder="Cari nama, email, atau user ID"
                    />
                  </div>
                  <select id="roleFilter" class="select-input">
                    <option value="all">Semua role</option>
                    <option value="admin">Admin</option>
                    <option value="reader">Reader</option>
                  </select>
                  <select id="statusFilter" class="select-input">
                    <option value="all">Semua status</option>
                    <option value="active">Aktif</option>
                    <option value="pending">Pending</option>
                    <option value="suspended">Suspended</option>
                  </select>
                </div>

                <div class="table-wrapper" style="max-height:30rem;border:none;border-radius:0">
                  <table class="data-table" style="min-width:720px">
                    <thead>
                      <tr>
                        <th>Akun</th>
                        <th>Username</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Email Confirmed</th>
                        <th>Last Sign In</th>
                        <th>Onboarding</th>
                        <th>Relasi</th>
                        <th style="text-align:right">Aksi</th>
                      </tr>
                    </thead>
                    <tbody id="usersTable"></tbody>
                  </table>
                </div>
                <div id="emptyState" class="hidden empty-state">
                  <i data-lucide="user-x"></i>
                  <p class="text-sm font-medium">Tidak ada akun yang cocok.</p>
                </div>
                <div class="table-footer">
                  <p id="paginationSummary" class="text-sm text-muted">0 akun</p>
                  <div class="flex items-center gap-2 flex-wrap">
                    <select id="pageSizeSelect" class="select-input" style="width:auto;min-width:130px">
                      <option value="50">50 / halaman</option>
                      <option value="100">100 / halaman</option>
                      <option value="200">200 / halaman</option>
                    </select>
                    <button id="prevPageBtn" type="button" class="btn btn-secondary">
                      <i data-lucide="chevron-left"></i>
                      <span>Prev</span>
                    </button>
                    <button id="nextPageBtn" type="button" class="btn btn-secondary">
                      <span>Next</span>
                      <i data-lucide="chevron-right"></i>
                    </button>
                  </div>
                </div>
              </div>

              <section id="relationTableWorkspace" class="hidden" style="scroll-margin-top:7rem"></section>
            </section>

            <!-- Right: Detail Panel -->
            <aside style="min-width:0">
              <div class="detail-panel sticky" style="top:88px">
                <div class="detail-header">
                  <div class="flex items-start justify-between gap-3">
                    <div style="min-width:0">
                      <p class="text-sm font-medium text-muted">Detail akun</p>
                      <h2 id="detailName" class="text-xl font-semibold truncate" style="margin-top:4px">Pilih akun</h2>
                    </div>
                    <span id="detailStatus" class="badge badge-slate">-</span>
                  </div>
                  <p id="detailEmail" class="text-sm text-muted" style="margin-top:6px;word-break:break-all">
                    Relasi muncul berdasarkan user ID.
                  </p>
                </div>
                <div class="detail-body">
                  <div class="panel-tabs" style="margin-bottom:16px">
                    <button data-panel-tab="profile" type="button" class="panel-tab tab-active">Profil</button>
                    <button data-panel-tab="relations" type="button" class="panel-tab">Relasi</button>
                    <button data-panel-tab="metadata" type="button" class="panel-tab">Metadata</button>
                  </div>
                  <div id="profilePanel" class="space-y-3"></div>
                  <div id="relationsPanel" class="space-y-4" hidden></div>
                  <div id="metadataPanel" class="space-y-3" hidden></div>
                </div>
              </div>
            </aside>

            <section
              id="relationDiagramWorkspace"
              class="hidden"
              style="grid-column:1/-1;scroll-margin-top:7rem"
            ></section>
          </div>
        </main>
      </div>
    </div>

    <!-- User Modal -->
    <div id="userModal" class="modal-backdrop">
      <div class="modal-content modal-md">
        <form id="userForm" style="display:grid;grid-template-rows:auto minmax(0,1fr) auto;max-height:90vh">
          <div class="modal-header">
            <h2 id="modalTitle">Tambah akun</h2>
            <button
              type="button"
              data-close-modal="userModal"
              class="btn-icon"
              title="Tutup"
            >
              <i data-lucide="x"></i>
            </button>
          </div>
          <div class="modal-body">
            <input id="editingUserId" type="hidden" />
            <div class="form-grid form-grid-2">
              <div class="input-group">
                <label class="input-label" for="emailField">Email</label>
                <input id="emailField" type="email" required class="input" />
              </div>
              <div class="input-group">
                <label class="input-label" for="passwordField">Password</label>
                <div class="password-wrapper">
                  <input id="passwordField" type="password" minlength="8" class="input" style="padding-right:44px" />
                  <button type="button" data-toggle-password="passwordField" class="password-toggle" title="Lihat password">
                    <i data-lucide="eye" class="eye-icon"></i>
                    <i data-lucide="eye-off" class="eye-off-icon hidden"></i>
                  </button>
                </div>
              </div>
              <div class="input-group">
                <label class="input-label" for="displayNameField">Display name</label>
                <input id="displayNameField" type="text" class="input" />
              </div>
              <div class="input-group">
                <label class="input-label" for="usernameField">Username</label>
                <input id="usernameField" type="text" class="input" />
              </div>
              <div class="input-group">
                <label class="input-label" for="accountRoleField">Account role</label>
                <select id="accountRoleField" class="select-input">
                  <option value="reader">Reader</option>
                  <option value="admin">Admin</option>
                </select>
              </div>
              <div class="input-group">
                <label class="input-label" for="accountStatusField">Account status</label>
                <select id="accountStatusField" class="select-input">
                  <option value="active">Aktif</option>
                  <option value="pending">Pending</option>
                  <option value="suspended">Suspended</option>
                </select>
              </div>
              <div class="input-group form-span-2">
                <label class="input-label" for="avatarUrlField">Avatar URL</label>
                <input id="avatarUrlField" type="url" class="input" />
              </div>
              <label class="form-span-2 flex items-start gap-2" style="cursor:pointer">
                <input id="onboardingField" type="checkbox" class="checkbox" style="margin-top:2px" />
                <span class="text-sm">Onboarding selesai</span>
              </label>
              <div id="roleWarning" class="hidden warning-box form-span-2"></div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" data-close-modal="userModal" class="btn btn-secondary">
              Batal
            </button>
            <button id="saveUserBtn" type="submit" class="btn btn-primary">
              <i data-lucide="save"></i>
              <span>Simpan</span>
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Delete Modal -->
    <div id="deleteModal" class="modal-backdrop" style="z-index:55">
      <div class="modal-content modal-sm">
        <div class="modal-header">
          <div class="flex items-start gap-3">
            <span class="stat-icon icon-red shrink-0">
              <i data-lucide="trash-2"></i>
            </span>
            <div>
              <h2 class="text-lg font-semibold">Hapus akun</h2>
              <p id="deleteMessage" class="text-sm text-muted" style="margin-top:4px"></p>
            </div>
          </div>
        </div>
        <div style="padding:20px">
          <div id="deleteRelations" class="space-y-2"></div>
          <label class="confirm-box" style="margin-top:16px;cursor:pointer">
            <input id="confirmCascade" type="checkbox" class="checkbox" style="margin-top:2px" />
            <span class="text-sm">Saya paham akun Supabase Auth dan semua data public.* terkait user ID ini akan dihapus.</span>
          </label>
        </div>
        <div class="modal-footer">
          <button type="button" data-close-modal="deleteModal" class="btn btn-secondary">
            Batal
          </button>
          <button id="confirmDeleteBtn" type="button" disabled class="btn btn-danger">
            <i data-lucide="trash-2"></i>
            <span>Hapus bersih</span>
          </button>
        </div>
      </div>
    </div>
    <script src="./account-dashboard.js"></script>
  </body>
</html>
