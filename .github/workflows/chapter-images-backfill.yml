# ============================================================
# Tonztoon Komik — Chapter Images Backfill GitHub Actions
# ============================================================
# Trigger:
#   1. Cron job backfill images terjadwal
#   2. workflow_dispatch manual untuk backfill images
#
# Strategi:
#   - Preflight check backlog dulu
#   - Jika pending=0, workflow selesai cepat (no-op)
#   - Jika masih ada backlog, jalankan batch backfill sekali jalan

name: "🖼️ Scraper: Chapter Images Backfill"

on:
  schedule:
    # Jalankan tiap 30 menit untuk menyapu backlog images yang baru muncul.
    - cron: "*/30 * * * *"

  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Source that triggered this workflow"
        required: false
        default: "manual"
      source:
        description: "Source filter (optional: komiku, komiku_asia, voratoon, shinigami)"
        required: false
        default: ""
      selection:
        description: "Selection strategy: ordered or random"
        required: false
        default: "random"
      batch_size:
        description: "Batch size per run"
        required: false
        default: "10"
      limit:
        description: "Max chapters to process in one run"
        required: false
        default: "20"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  preflight:
    name: Check Pending Chapter Images
    runs-on: ubuntu-latest
    outputs:
      has_pending: ${{ steps.pending.outputs.has_pending }}
      pending_count: ${{ steps.pending.outputs.pending_count }}
      pending_by_source: ${{ steps.pending.outputs.pending_by_source }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: 🔎 Check pending chapter images
        id: pending
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SOURCE_FILTER: ${{ github.event.inputs.source || '' }}
        run: |
          cd backend
          if [ -n "${SOURCE_FILTER}" ] && [ "${SOURCE_FILTER}" != "all" ]; then
            python -m scraper.check_pending_chapter_images --source "${SOURCE_FILTER}" --github-output "${GITHUB_OUTPUT}"
          else
            python -m scraper.check_pending_chapter_images --github-output "${GITHUB_OUTPUT}"
          fi

      - name: 📝 Log preflight summary
        env:
          SOURCE_FILTER: ${{ github.event.inputs.source || '' }}
        run: |
          set -euo pipefail

          completed_at="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          source_filter="${SOURCE_FILTER:-}"
          if [ -z "${source_filter}" ]; then
            source_filter="<all sources>"
          fi

          {
            echo "## 🖼️ Chapter images preflight summary"
            echo
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Has pending | ${{ steps.pending.outputs.has_pending }} |"
            echo "| Pending count | ${{ steps.pending.outputs.pending_count }} |"
            echo "| Pending by source | ${{ steps.pending.outputs.pending_by_source }} |"
            echo "| Source filter | ${source_filter} |"
            echo "| Completed at | ${completed_at} |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "has_pending=${{ steps.pending.outputs.has_pending }}"
          echo "pending_count=${{ steps.pending.outputs.pending_count }}"
          echo "pending_by_source=${{ steps.pending.outputs.pending_by_source }}"

  backfill:
    name: Run Chapter Images Backfill
    needs: preflight
    if: needs.preflight.outputs.has_pending == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: 🖥️ Install virtual display
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.source == '' || github.event.inputs.source == 'all' || github.event.inputs.source == 'komiku_asia'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: 🌐 Install Scrapling browser dependencies
        run: scrapling install

      - name: 🖼️ Run chapter images backfill
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SOURCE_FILTER: ${{ github.event.inputs.source || '' }}
          SELECTION_MODE: ${{ github.event.inputs.selection || 'random' }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '10' }}
          LIMIT_COUNT: ${{ github.event.inputs.limit || '20' }}
          KOMIKU_ASIA_HEADLESS: "false"
          KOMIKU_ASIA_PROXY: ${{ secrets.KOMIKU_ASIA_PROXY }}
        run: |
          set -euo pipefail

          cd backend
          CMD="python -m scraper.sync_chapter_images --selection ${SELECTION_MODE} --batch-size ${BATCH_SIZE} --limit ${LIMIT_COUNT}"
          if [ -n "${SOURCE_FILTER}" ] && [ "${SOURCE_FILTER}" != "all" ]; then
            CMD="${CMD} --source ${SOURCE_FILTER}"
          fi
          echo "Running: ${CMD}"
          if [ "${SOURCE_FILTER}" = "komiku_asia" ]; then
            echo "Running komiku_asia through xvfb."
            xvfb-run -a -s "-screen 0 1366x768x24" bash -lc "${CMD}"
          elif [ -z "${SOURCE_FILTER}" ] || [ "${SOURCE_FILTER}" = "all" ]; then
            echo "Running non-komiku_asia sources without xvfb."
            for source in komiku voratoon shinigami; do
              bash -lc "${CMD} --source ${source}"
            done
            echo "Running komiku_asia through xvfb."
            xvfb-run -a -s "-screen 0 1366x768x24" bash -lc "${CMD} --source komiku_asia"
          else
            echo "komiku_asia is not included; running without xvfb."
            bash -lc "${CMD}"
          fi

      - name: 📝 Log completion
        if: always()
        env:
          SOURCE_FILTER: ${{ github.event.inputs.source || '' }}
          SELECTION_MODE: ${{ github.event.inputs.selection || 'random' }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '10' }}
          LIMIT_COUNT: ${{ github.event.inputs.limit || '20' }}
        run: |
          set -euo pipefail

          completed_at="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          source_filter="${SOURCE_FILTER:-}"
          if [ -z "${source_filter}" ]; then
            source_filter="<all sources>"
          fi

          {
            echo "## 🖼️ Chapter images backfill summary"
            echo
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Initial pending count | ${{ needs.preflight.outputs.pending_count }} |"
            echo "| Source filter | ${source_filter} |"
            echo "| Selection mode | ${SELECTION_MODE} |"
            echo "| Batch size | ${BATCH_SIZE} |"
            echo "| Limit | ${LIMIT_COUNT} |"
            echo "| Completed at | ${completed_at} |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Chapter images backfill finished at $(date -u)"
          echo "Initial pending_count=${{ needs.preflight.outputs.pending_count }}"

  no-op:
    name: No Pending Images
    needs: preflight
    if: needs.preflight.outputs.has_pending != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: 💤 Skip backfill
        run: |
          set -euo pipefail

          completed_at="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"

          {
            echo "## 💤 Chapter images backfill summary"
            echo
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Status | Skipped, no pending images |"
            echo "| Pending count | ${{ needs.preflight.outputs.pending_count }} |"
            echo "| Pending by source | ${{ needs.preflight.outputs.pending_by_source }} |"
            echo "| Completed at | ${completed_at} |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "No pending chapter images found."
          echo "pending_count=${{ needs.preflight.outputs.pending_count }}"
          echo "pending_by_source=${{ needs.preflight.outputs.pending_by_source }}"
