# ================================================
# Tonztoon Komik — Scraper GitHub Actions Workflow
# ================================================
# Trigger:
#   1. Cron job latest update (terjadwal setiap 2 jam)
#   2. workflow_dispatch manual untuk latest sync

name: "🕷️ Scraper: Latest Sync"

on:
  schedule:
    # Jalankan setiap 2 jam (00:00, 02:00, 04:00, 06:00, 08:00, 10:00, 12:00, 14:00, 16:00, 18:00, 20:00, 22:00 UTC)
    - cron: "0 */2 * * *"

  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Source that triggered this workflow"
        required: false
        default: "manual"
      source:
        description: "Optional scraper source to sync (empty = all sources)"
        required: false
        default: ""
      max_pages:
        description: "Latest pages to scan (0 disables latest feed)"
        required: false
        default: "10"

# Force Node.js 24 to avoid deprecation warnings
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    name: Run Comic Scraper
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: 🖥️ Install virtual display
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.source == '' || github.event.inputs.source == 'all' || github.event.inputs.source == 'komiku_asia'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      
      - name: 🌐 Install Scrapling browser dependencies
        run: scrapling install

      - name: 🕷️ Run scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SCRAPER_SOURCE: ${{ github.event.inputs.source || '' }}
          SCRAPER_MAX_PAGES: ${{ github.event.inputs.max_pages || '' }}
          KOMIKU_ASIA_HEADLESS: "false"
        run: |
          set +e
          {
            set -euo pipefail

            cd backend

            args=()

            if [ -n "${SCRAPER_SOURCE}" ] && [ "${SCRAPER_SOURCE}" != "all" ]; then
              args+=(--source "${SCRAPER_SOURCE}")
            fi

            if [ -n "${SCRAPER_MAX_PAGES}" ]; then
              if ! [[ "${SCRAPER_MAX_PAGES}" =~ ^[0-9]+$ ]]; then
                echo "max_pages must be an integer >= 0"
                exit 1
              fi
              args+=(--max-pages "${SCRAPER_MAX_PAGES}")
            fi

            printf 'Running scraper with args:'
            printf ' %q' "${args[@]}"
            printf '\n'

            if [ "${SCRAPER_SOURCE}" = "komiku_asia" ]; then
              echo "Running komiku_asia through xvfb."
              xvfb-run -a -s "-screen 0 1366x768x24" python -m scraper.main "${args[@]}"
            elif [ -z "${SCRAPER_SOURCE}" ] || [ "${SCRAPER_SOURCE}" = "all" ]; then
              echo "Running non-komiku_asia sources without xvfb."
              for source in komiku komikcast shinigami; do
                python -m scraper.main --source "${source}" "${args[@]}"
              done
              echo "Running komiku_asia through xvfb."
              xvfb-run -a -s "-screen 0 1366x768x24" python -m scraper.main --source komiku_asia "${args[@]}"
            else
              echo "komiku_asia is not included; running without xvfb."
              python -m scraper.main "${args[@]}"
            fi
          } 2>&1 | tee scraper-latest.log
          status=${PIPESTATUS[0]}
          echo "${status}" > scraper-latest.status
          exit "${status}"

      - name: 📝 Write scraper summary
        if: always()
        env:
          TRIGGER_SOURCE: ${{ github.event.inputs.trigger_source || github.event_name }}
          SCRAPER_SOURCE: ${{ github.event.inputs.source || 'all' }}
          SCRAPER_MAX_PAGES: ${{ github.event.inputs.max_pages || 'default' }}
        run: |
          set -euo pipefail

          completed_at="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"

          status="unknown"
          if [ -f scraper-latest.status ]; then
            status="$(cat scraper-latest.status)"
          fi

          result_errors="false"
          if [ -f scraper-latest.log ] && grep -E "( ERROR | ✗ | failed:|Gagal| [1-9][0-9]* errors)" scraper-latest.log >/dev/null; then
            result_errors="true"
          fi

          if [ "${status}" = "0" ] && [ "${result_errors}" = "false" ]; then
            conclusion="success"
          elif [ "${status}" = "0" ]; then
            conclusion="completed_with_errors"
          else
            conclusion="failed"
          fi

          {
            echo "## 🕷️ Scraper summary"
            echo
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Trigger source | ${TRIGGER_SOURCE} |"
            echo "| Source | ${SCRAPER_SOURCE} |"
            echo "| Latest pages | ${SCRAPER_MAX_PAGES} |"
            echo "| Exit status | ${status} (${conclusion}) |"
            echo "| Completed at | ${completed_at} |"
            echo

            if [ -f scraper-latest.log ]; then
              python - <<'PY'
          import re
          from pathlib import Path

          log_path = Path("scraper-latest.log")
          text = log_path.read_text(encoding="utf-8", errors="replace")
          lines = text.splitlines()

          clean_re = re.compile(r"\x1b\[[0-9;?]*[A-Za-z]")
          def clean(value: str) -> str:
              return clean_re.sub("", value)

          source_re = re.compile(r"Scraper:\s+([a-z_]+)\s+\(")
          done_re = re.compile(
              r"Selesai scraper ([a-z_]+): "
              r"(\d+) pages, (\d+) listing items, (\d+) candidates, "
              r"(\d+) unchanged, (\d+) comics, (\d+) chapter metadata, "
              r"(\d+) chapter images pre-warmed, (\d+) skipped, (\d+) errors"
          )
          update_re = re.compile(r"Done:\s+(.+?)\s+[—-]\s+(\d+) chapters metadata,\s+(\d+) images pre-warmed")
          summaries = []
          updates = []
          errors = []
          current_source = "unknown"

          for raw_line in lines:
              line = clean(raw_line)
              source_match = source_re.search(line)
              if source_match:
                  current_source = source_match.group(1)

              done_match = done_re.search(line)
              if done_match:
                  summaries.append(done_match.groups())

              update_match = update_re.search(line)
              if update_match and len(updates) < 5:
                  title, chapters, images = update_match.groups()
                  updates.append((current_source, title.strip(), chapters, images))

              lowered = line.lower()
              nonzero_error_count = re.search(r"\b[1-9][0-9]* errors\b", lowered) is not None
              if (
                  " error " in f" {lowered} "
                  or nonzero_error_count
                  or "failed:" in lowered
                  or "gagal" in lowered
                  or "✗" in line
              ):
                  errors.append(line)

          if summaries:
              print("### Per-source latest results")
              print()
              print("| Source | Pages | Listing | Candidates | Unchanged | Comics updated | Chapter metadata | Images pre-warmed | Skipped | Errors |")
              print("|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|")
              for row in summaries:
                  source, pages, listing, candidates, unchanged, comics, meta, images, skipped, errs = row
                  print(f"| {source} | {pages} | {listing} | {candidates} | {unchanged} | {comics} | {meta} | {images} | {skipped} | {errs} |")
              print()

          if summaries:
              totals = {
                  "Pages": 0,
                  "Listing": 0,
                  "Candidates": 0,
                  "Unchanged": 0,
                  "Comics": 0,
                  "Chapter meta": 0,
                  "Pre-warmed": 0,
                  "Skipped": 0,
                  "Errors": 0,
              }
              for row in summaries:
                  _, pages, listing, candidates, unchanged, comics, meta, images, skipped, errs = row
                  totals["Pages"] += int(pages)
                  totals["Listing"] += int(listing)
                  totals["Candidates"] += int(candidates)
                  totals["Unchanged"] += int(unchanged)
                  totals["Comics"] += int(comics)
                  totals["Chapter meta"] += int(meta)
                  totals["Pre-warmed"] += int(images)
                  totals["Skipped"] += int(skipped)
                  totals["Errors"] += int(errs)

              print("### Aggregate totals")
              print()
              print("| Metric | Value |")
              print("|---|---:|")
              for key in ("Pages", "Listing", "Candidates", "Unchanged", "Comics", "Chapter meta", "Pre-warmed", "Skipped", "Errors"):
                  print(f"| {key} | {totals[key]} |")
              print()

          print("### Sample updated comics")
          print()
          if updates:
              print("| Source | Comic | Chapter metadata | Images pre-warmed |")
              print("|---|---|---:|---:|")
              for source, title, chapters, images in updates:
                  title = title.replace("|", "\\|")
                  print(f"| {source} | {title} | {chapters} | {images} |")
          else:
              print("No updated comics were logged in this run.")
          print()

          if errors:
              print("### Error lines")
              print()
              print("```text")
              for line in errors[-40:]:
                  print(line)
              print("```")
              print()
          PY

              echo "### Recent scraper log"
              echo
              echo '```text'
              tail -n 120 scraper-latest.log
              echo '```'
            else
              echo "No scraper log was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Scraper workflow finished at $(date -u)"

      - name: 📎 Upload scraper log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-latest-log
          path: scraper-latest.log
          if-no-files-found: ignore
