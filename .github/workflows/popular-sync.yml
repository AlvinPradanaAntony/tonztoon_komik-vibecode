# ======================================================
# Tonztoon Komik — Popular Feed Sync GitHub Actions Workflow
# ======================================================

name: "🔥 Scraper: Popular Sync"

on:
  schedule:
    # Jalankan setiap 3 jam sekali (0:00, 3:00, 6:00 UTC)
    - cron: "0 */3 * * *"

  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Source that triggered this workflow"
        required: false
        default: "manual"
      popular_pages:
        description: "Jumlah halaman popular yang ingin disinkronkan"
        required: false
        default: "10"
      source:
        description: "Optional scraper source to sync (empty = all sources)"
        required: false
        default: ""
      popular_no_early_stop:
        description: "Nonaktifkan early-stop untuk popular feed"
        required: false
        type: boolean
        default: false
      early_stop:
        description: "Number of unchanged pages before stopping"
        required: false
        default: "3"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: scraper-push-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape-popular:
    name: Run Popular Feed Sync
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: 🖥️ Install virtual display
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.source == '' || github.event.inputs.source == 'all' || github.event.inputs.source == 'komiku_asia'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: 🌐 Install Scrapling browser dependencies
        run: scrapling install

      - name: 🔐 Validate database and FCM configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
        run: |
          cd backend
          python -m scraper.validate_config

      - name: 🔥 Run popular sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          POPULAR_PAGES: ${{ github.event.inputs.popular_pages || '10' }}
          SCRAPER_SOURCE: ${{ github.event.inputs.source || '' }}
          POPULAR_NO_EARLY_STOP: ${{ github.event.inputs.popular_no_early_stop || 'false' }}
          SCRAPER_EARLY_STOP: ${{ github.event.inputs.early_stop || '' }}
          KOMIKU_ASIA_HEADLESS: "false"
          KOMIKU_ASIA_PROXY: ${{ secrets.KOMIKU_ASIA_PROXY }}
        run: |
          set +e
          {
            set -euo pipefail

            cd backend

            args=(--max-pages 0 --popular-pages "${POPULAR_PAGES}")

            if [ -n "${SCRAPER_SOURCE}" ] && [ "${SCRAPER_SOURCE}" != "all" ]; then
              args+=(--source "${SCRAPER_SOURCE}")
              if [[ "${SCRAPER_SOURCE}" == "komiku" || "${SCRAPER_SOURCE}" == "voratoon" || "${SCRAPER_SOURCE}" == "shinigami" ]]; then
                args+=(--no-anti-blocking)
              fi
            fi

            if [ "${POPULAR_NO_EARLY_STOP}" = "true" ]; then
              args+=(--popular-no-early-stop)
            fi

            if [ -n "${SCRAPER_EARLY_STOP}" ]; then
              if ! [[ "${SCRAPER_EARLY_STOP}" =~ ^[0-9]+$ ]]; then
                echo "early_stop must be an integer >= 1"
                exit 1
              fi
              args+=(--early-stop "${SCRAPER_EARLY_STOP}")
            fi

            printf 'Running popular sync with args:'
            printf ' %q' "${args[@]}"
            echo ""

            if [ "${SCRAPER_SOURCE}" = "komiku_asia" ]; then
              echo "Running komiku_asia through xvfb."
              xvfb-run -a -s "-screen 0 1366x768x24" python -m scraper.main "${args[@]}"
            elif [ -z "${SCRAPER_SOURCE}" ] || [ "${SCRAPER_SOURCE}" = "all" ]; then
              echo "Running non-komiku_asia sources without xvfb."
              for source in komiku voratoon shinigami; do
                echo "─── Source: ${source} ───"
                python -m scraper.main --source "${source}" --no-anti-blocking "${args[@]}" || {
                  echo "::warning::Popular sync untuk source ${source} selesai dengan error."
                }
              done
              echo "─── Source: komiku_asia ───"
              echo "Running komiku_asia through xvfb."
              xvfb-run -a -s "-screen 0 1366x768x24" python -m scraper.main --source komiku_asia "${args[@]}" || {
                echo "::warning::Popular sync untuk source komiku_asia selesai dengan error."
              }
            else
              echo "komiku_asia is not included; running without xvfb."
              python -m scraper.main "${args[@]}"
            fi
          } 2>&1 | tee popular-sync.log
          status=${PIPESTATUS[0]}
          echo "${status}" > popular-sync.status
          exit "${status}"

      - name: 📝 Write popular sync summary
        if: always()
        run: |
          PYTHONPATH=backend python -m scraper.report_summary \
            --log-file popular-sync.log \
            --status-file popular-sync.status \
            --mode popular \
            --trigger-source "${{ github.event.inputs.trigger_source || github.event_name }}" \
            --source "${{ github.event.inputs.source || 'all' }}" \
            --popular-pages "${{ github.event.inputs.popular_pages || '10' }}" \
            --popular-no-early-stop "${{ github.event.inputs.popular_no_early_stop || 'false' }}" \
            --early-stop "${{ github.event.inputs.early_stop || 'default' }}" >> "$GITHUB_STEP_SUMMARY"

      - name: 📎 Upload popular sync log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: popular-sync-log
          path: |
            popular-sync.log
            backend/popular-sync.log
          if-no-files-found: ignore
