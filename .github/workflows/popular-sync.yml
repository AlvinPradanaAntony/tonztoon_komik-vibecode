# ======================================================
# Tonztoon Komik — Popular Feed Sync GitHub Actions Workflow
# ======================================================
# Trigger:
#   1. Cron job populer (terjadwal harian)
#   2. workflow_dispatch manual untuk popular sync

name: "🔥 Scraper: Popular Sync"

on:
  schedule:
    # Jalankan setiap 2 jam sekali (0:00, 2:00, 4:00, 6:00, 8:00, 10:00, 12:00, 14:00, 16:00, 18:00, 20:00, 22:00 UTC)
    - cron: "0 */2 * * *"

  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Source that triggered this workflow"
        required: false
        default: "manual"
      popular_pages:
        description: "Jumlah halaman popular yang ingin disinkronkan"
        required: false
        default: "10"
      source:
        description: "Optional scraper source to sync (empty = all sources)"
        required: false
        default: ""
      popular_no_early_stop:
        description: "Nonaktifkan early-stop untuk popular feed"
        required: false
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape-popular:
    name: Run Popular Feed Sync
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: 🖥️ Install virtual display
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.source == '' || github.event.inputs.source == 'all' || github.event.inputs.source == 'komiku_asia'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: 🌐 Install Scrapling browser dependencies
        run: scrapling install

      - name: 🔥 Run popular sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POPULAR_PAGES: ${{ github.event.inputs.popular_pages || '10' }}
          SCRAPER_SOURCE: ${{ github.event.inputs.source || '' }}
          POPULAR_NO_EARLY_STOP: ${{ github.event.inputs.popular_no_early_stop || 'false' }}
          KOMIKU_ASIA_HEADLESS: "false"
        run: |
          set +e
          {
            set -euo pipefail

            cd backend

            args=(--max-pages 0 --popular-pages "${POPULAR_PAGES}")

            if [ -n "${SCRAPER_SOURCE}" ] && [ "${SCRAPER_SOURCE}" != "all" ]; then
              args+=(--source "${SCRAPER_SOURCE}")
            fi

            if [ "${POPULAR_NO_EARLY_STOP}" = "true" ]; then
              args+=(--popular-no-early-stop)
            fi

            printf 'Running popular sync with args:'
            printf ' %q' "${args[@]}"
            printf '\n'

            if [ "${SCRAPER_SOURCE}" = "komiku_asia" ]; then
              echo "Running komiku_asia through xvfb."
              xvfb-run -a -s "-screen 0 1366x768x24" python -m scraper.main "${args[@]}"
            elif [ -z "${SCRAPER_SOURCE}" ] || [ "${SCRAPER_SOURCE}" = "all" ]; then
              echo "Running non-komiku_asia sources without xvfb."
              for source in komiku komikcast shinigami; do
                python -m scraper.main --source "${source}" "${args[@]}"
              done
              echo "Running komiku_asia through xvfb."
              xvfb-run -a -s "-screen 0 1366x768x24" python -m scraper.main --source komiku_asia "${args[@]}"
            else
              echo "komiku_asia is not included; running without xvfb."
              python -m scraper.main "${args[@]}"
            fi
          } 2>&1 | tee popular-sync.log
          status=${PIPESTATUS[0]}
          echo "${status}" > popular-sync.status
          exit "${status}"

      - name: 📝 Write popular sync summary
        if: always()
        env:
          TRIGGER_SOURCE: ${{ github.event.inputs.trigger_source || github.event_name }}
          POPULAR_PAGES: ${{ github.event.inputs.popular_pages || '10' }}
          SCRAPER_SOURCE: ${{ github.event.inputs.source || 'all' }}
          POPULAR_NO_EARLY_STOP: ${{ github.event.inputs.popular_no_early_stop || 'false' }}
        run: |
          set -euo pipefail

          completed_at="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"

          status="unknown"
          if [ -f popular-sync.status ]; then
            status="$(cat popular-sync.status)"
          fi

          result_errors="false"
          if [ -f popular-sync.log ] && grep -E "( ERROR | ✗ | failed:|Gagal| [1-9][0-9]* errors)" popular-sync.log >/dev/null; then
            result_errors="true"
          fi

          if [ "${status}" = "0" ] && [ "${result_errors}" = "false" ]; then
            conclusion="success"
          elif [ "${status}" = "0" ]; then
            conclusion="completed_with_errors"
          else
            conclusion="failed"
          fi

          {
            echo "## 🔥 Popular sync summary"
            echo
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Trigger source | ${TRIGGER_SOURCE} |"
            echo "| Source | ${SCRAPER_SOURCE} |"
            echo "| Popular pages | ${POPULAR_PAGES} |"
            echo "| Popular no early-stop | ${POPULAR_NO_EARLY_STOP} |"
            echo "| Exit status | ${status} (${conclusion}) |"
            echo "| Completed at | ${completed_at} |"
            echo

            if [ -f popular-sync.log ]; then
              python - <<'PY'
          import re
          from pathlib import Path

          log_path = Path("popular-sync.log")
          text = log_path.read_text(encoding="utf-8", errors="replace")
          lines = text.splitlines()

          clean_re = re.compile(r"\x1b\[[0-9;?]*[A-Za-z]")
          def clean(value: str) -> str:
              return clean_re.sub("", value)

          source_re = re.compile(r"Scraper:\s+([a-z_]+)\s+\(")
          done_re = re.compile(
              r"Selesai scraper ([a-z_]+): "
              r"(\d+) pages, (\d+) listing items, (\d+) candidates, "
              r"(\d+) unchanged, (\d+) comics, (\d+) chapter metadata, "
              r"(\d+) chapter images pre-warmed, (\d+) skipped, (\d+) errors"
          )
          popular_page_re = re.compile(r"Ringkasan popular page (\d+): (\d+) kandidat baru, (\d+) existing ditandai")
          new_re = re.compile(r"Kandidat popular baru:\s+(.+?)\s+\(")
          existing_re = re.compile(r"Mark popular:\s+(.+?)\s+\(")
          done_comic_re = re.compile(r"Done:\s+(.+?)\s+[—-]\s+(\d+) chapters metadata,\s+(\d+) images pre-warmed")

          summaries = []
          page_rows = []
          samples = []
          errors = []
          current_source = "unknown"

          for raw_line in lines:
              line = clean(raw_line)
              source_match = source_re.search(line)
              if source_match:
                  current_source = source_match.group(1)

              done_match = done_re.search(line)
              if done_match:
                  summaries.append(done_match.groups())

              page_match = popular_page_re.search(line)
              if page_match:
                  page, candidates, existing = page_match.groups()
                  page_rows.append((current_source, page, candidates, existing))

              if len(samples) < 5:
                  new_match = new_re.search(line)
                  if new_match:
                      samples.append((current_source, "new", new_match.group(1).strip(), "-", "-"))
                      continue

                  existing_match = existing_re.search(line)
                  if existing_match:
                      samples.append((current_source, "existing", existing_match.group(1).strip(), "-", "-"))
                      continue

                  done_match = done_comic_re.search(line)
                  if done_match:
                      title, chapters, images = done_match.groups()
                      samples.append((current_source, "processed", title.strip(), chapters, images))

              lowered = line.lower()
              nonzero_error_count = re.search(r"\b[1-9][0-9]* errors\b", lowered) is not None
              if (
                  " error " in f" {lowered} "
                  or nonzero_error_count
                  or "failed:" in lowered
                  or "gagal" in lowered
                  or "✗" in line
              ):
                  errors.append(line)

          if summaries:
              print("### Per-source popular results")
              print()
              print("| Source | Pages | Listing | New candidates | Existing/unchanged | Comics updated | Chapter metadata | Images pre-warmed | Skipped | Errors |")
              print("|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|")
              for row in summaries:
                  source, pages, listing, candidates, unchanged, comics, meta, images, skipped, errs = row
                  print(f"| {source} | {pages} | {listing} | {candidates} | {unchanged} | {comics} | {meta} | {images} | {skipped} | {errs} |")
              print()

              totals = {
                  "Pages": 0,
                  "Listing": 0,
                  "New candidates": 0,
                  "Existing/unchanged": 0,
                  "Comics updated": 0,
                  "Chapter meta": 0,
                  "Pre-warmed": 0,
                  "Skipped": 0,
                  "Errors": 0,
              }
              for row in summaries:
                  _, pages, listing, candidates, unchanged, comics, meta, images, skipped, errs = row
                  totals["Pages"] += int(pages)
                  totals["Listing"] += int(listing)
                  totals["New candidates"] += int(candidates)
                  totals["Existing/unchanged"] += int(unchanged)
                  totals["Comics updated"] += int(comics)
                  totals["Chapter meta"] += int(meta)
                  totals["Pre-warmed"] += int(images)
                  totals["Skipped"] += int(skipped)
                  totals["Errors"] += int(errs)

              print("### Aggregate totals")
              print()
              print("| Metric | Value |")
              print("|---|---:|")
              for key in ("Pages", "Listing", "New candidates", "Existing/unchanged", "Comics updated", "Chapter meta", "Pre-warmed", "Skipped", "Errors"):
                  print(f"| {key} | {totals[key]} |")
              print()

          if page_rows:
              print("### Popular page summary")
              print()
              print("| Source | Page | New candidates | Existing marked |")
              print("|---|---:|---:|---:|")
              for source, page, candidates, existing in page_rows[:10]:
                  print(f"| {source} | {page} | {candidates} | {existing} |")
              print()

          print("### Sample popular items")
          print()
          if samples:
              print("| Source | Status | Comic | Chapter metadata | Images pre-warmed |")
              print("|---|---|---|---:|---:|")
              for source, status, title, chapters, images in samples[:5]:
                  title = title.replace("|", "\\|")
                  print(f"| {source} | {status} | {title} | {chapters} | {images} |")
          else:
              print("No popular item samples were logged in this run.")
          print()

          if errors:
              print("### Error lines")
              print()
              print("```text")
              for line in errors[-40:]:
                  print(line)
              print("```")
              print()
          PY

              echo "### Recent popular sync log"
              echo
              echo '```text'
              tail -n 120 popular-sync.log
              echo '```'
            else
              echo "No popular sync log was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Popular sync workflow finished at $(date -u)"

      - name: 📎 Upload popular sync log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: popular-sync-log
          path: popular-sync.log
          if-no-files-found: ignore
