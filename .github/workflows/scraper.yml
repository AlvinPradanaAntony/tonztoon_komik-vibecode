# ================================================
# Tonztoon Komik — Scraper GitHub Actions Workflow
# ================================================
# Trigger:
#   1. Cron job latest update (terjadwal setiap 4 jam)
#   2. workflow_dispatch manual untuk latest sync

name: "🕷️ Scraper: Latest Sync"

on:
  schedule:
    # Jalankan setiap 4 jam (00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
    - cron: "0 */4 * * *"

  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Source that triggered this workflow"
        required: false
        default: "manual"

# Force Node.js 24 to avoid deprecation warnings
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    name: Run Comic Scraper
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: 🖥️ Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      
      - name: 🌐 Install Scrapling browser dependencies
        run: scrapling install

      - name: 🕷️ Run scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd backend
          xvfb-run -a -s "-screen 0 1366x768x24" python -m scraper.main

      - name: 📝 Log completion
        if: always()
        env:
          TRIGGER_SOURCE: ${{ github.event.inputs.trigger_source || github.event_name }}
        run: |
          set -euo pipefail

          completed_at="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"

          {
            echo "## 🕷️ Scraper summary"
            echo
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Trigger source | ${TRIGGER_SOURCE} |"
            echo "| Completed at | ${completed_at} |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Scraper workflow finished at $(date -u)"
