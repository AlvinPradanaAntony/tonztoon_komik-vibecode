name: 🚀 Build & Publish Release

on:
  push:
    tags:
      - 'v*.*.*'   # Trigger saat push tag seperti v1.0.0, v1.2.3, dll

env:
  FLUTTER_VERSION: '3.41.9'
  FLUTTER_CHANNEL: stable
  FLUTTER_PUB_CACHE_PATH: ~/.pub-cache

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Ekstrak Changelog untuk versi ini
  # ─────────────────────────────────────────────
  extract-changelog:
    name: 📋 Extract Changelog
    runs-on: ubuntu-latest
    outputs:
      release_notes: ${{ steps.changelog.outputs.release_notes }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Get version dari tag
        id: version
        run: |
          # Ambil versi tanpa prefix 'v' (misal: v1.0.0 -> 1.0.0)
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION"

      - name: Validate API_BASE_URL
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "❌ API_BASE_URL secret kosong"
            exit 1
          fi

          echo "✅ API_BASE_URL tersedia"
          echo "Length: ${#API_BASE_URL}"

      - name: Validasi versi release
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          PUBSPEC_VERSION=$(awk '/^version: / {print $2; exit}' frontend/pubspec.yaml)
          PUBSPEC_BUILD_NAME="${PUBSPEC_VERSION%%+*}"

          if [ -z "$PUBSPEC_VERSION" ]; then
            echo "❌ version tidak ditemukan di frontend/pubspec.yaml"
            exit 1
          fi

          if [ "$PUBSPEC_BUILD_NAME" != "$VERSION" ]; then
            echo "❌ Versi tag dan pubspec.yaml tidak sama."
            echo "   Tag release     : $GITHUB_REF_NAME"
            echo "   Versi dari tag  : $VERSION"
            echo "   Versi pubspec   : $PUBSPEC_VERSION"
            echo ""
            echo "Perbaiki dengan menyamakan pubspec.yaml, contoh:"
            echo "version: $VERSION+1"
            exit 1
          fi

          if ! grep -Fq "## [$VERSION]" CHANGELOG.md; then
            echo "❌ CHANGELOG.md belum punya entry untuk versi $VERSION"
            echo "Tambahkan header seperti:"
            echo "## [$VERSION] - $(date +%F)"
            exit 1
          fi

          echo "✅ Versi release konsisten: tag $GITHUB_REF_NAME, pubspec $PUBSPEC_VERSION, changelog $VERSION"

      - name: Ekstrak release notes dari CHANGELOG.md
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Ambil changelog versi terbaru dan maksimal satu blok collapse riwayat versi sebelumnya.
          NOTES=$(awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 {found=1; next}
            !found {next}
            /^<!--/ {exit}
            !after_section && /^---$/ {after_section=1; print; next}
            !after_section && /^## \[/ {exit}
            !after_section {print; next}
            after_section && /^<details>/ {details=1; print; next}
            after_section && details {print; if ($0 ~ /^<\/details>/) exit; next}
            after_section && /^[[:space:]]*$/ {print; next}
            after_section {exit}
          ' CHANGELOG.md)
          
          if [ -z "$NOTES" ]; then
            echo "❌ Release notes untuk $VERSION kosong."
            echo "Isi detail perubahan di bawah header ## [$VERSION] sebelum membuat tag release."
            exit 1
          fi
          
          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "✅ Release notes berhasil diekstrak"

  # ─────────────────────────────────────────────
  # JOB 2: Build Android APK
  # ─────────────────────────────────────────────
  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest
    needs: extract-changelog
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Restore Flutter SDK cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.tool_cache }}/flutter/${{ env.FLUTTER_CHANNEL }}-${{ env.FLUTTER_VERSION }}-x64
          key: flutter-${{ runner.os }}-${{ env.FLUTTER_CHANNEL }}-${{ env.FLUTTER_VERSION }}-x64

      - name: Restore Flutter pub cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.FLUTTER_PUB_CACHE_PATH }}
          key: flutter-pub-${{ runner.os }}-${{ env.FLUTTER_CHANNEL }}-${{ env.FLUTTER_VERSION }}-x64-${{ hashFiles('frontend/pubspec.lock') }}
          restore-keys: |
            flutter-pub-${{ runner.os }}-${{ env.FLUTTER_CHANNEL }}-${{ env.FLUTTER_VERSION }}-x64-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          architecture: x64
          cache: false

      - name: Install dependencies
        run: flutter pub get

      - name: Restore Android Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail

          if [ -f android/app/google-services.json ]; then
            echo "✅ android/app/google-services.json tersedia dari repository"
            exit 0
          fi

          if [ -z "${GOOGLE_SERVICES_JSON}" ]; then
            echo "❌ android/app/google-services.json tidak ada dan GOOGLE_SERVICES_JSON secret kosong"
            exit 1
          fi

          printf '%s' "${GOOGLE_SERVICES_JSON}" > android/app/google-services.json
          echo "✅ android/app/google-services.json dibuat dari GitHub Secret"

      - name: Analyze project
        run: flutter analyze --no-fatal-infos

      - name: Restore Android release signing files
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          for secret_name in \
            ANDROID_UPLOAD_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_PASSWORD \
            ANDROID_KEY_ALIAS
          do
            if [ -z "${!secret_name}" ]; then
              echo "❌ $secret_name secret kosong"
              exit 1
            fi
          done

          mkdir -p android/app
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          if [ ! -s android/app/upload-keystore.jks ]; then
            echo "❌ android/app/upload-keystore.jks gagal dibuat"
            exit 1
          fi

          echo "✅ Android release signing files siap"

      - name: Build APK (release)
        run: |
          flutter build apk --release \
            --build-name=${{ needs.extract-changelog.outputs.version }} \
            --build-number=${{ github.run_number }} \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}

      - name: Rename APK
        run: |
          VERSION="${{ needs.extract-changelog.outputs.version }}"
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/tonztoon-v${VERSION}.apk

      - name: Remove Android release signing files
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.jks

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: frontend/build/app/outputs/flutter-apk/tonztoon-v*.apk
          retention-days: 7

  # ─────────────────────────────────────────────
  # JOB 3: Build iOS IPA
  # ─────────────────────────────────────────────
  build-ios:
    name: 🍎 Build iOS IPA
    runs-on: macos-latest
    needs: extract-changelog
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Restore Flutter SDK cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.tool_cache }}/flutter/${{ env.FLUTTER_CHANNEL }}-${{ env.FLUTTER_VERSION }}-arm64
          key: flutter-${{ runner.os }}-${{ env.FLUTTER_CHANNEL }}-${{ env.FLUTTER_VERSION }}-arm64

      - name: Restore Flutter pub cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.FLUTTER_PUB_CACHE_PATH }}
          key: flutter-pub-${{ runner.os }}-${{ env.FLUTTER_CHANNEL }}-${{ env.FLUTTER_VERSION }}-arm64-${{ hashFiles('frontend/pubspec.lock') }}
          restore-keys: |
            flutter-pub-${{ runner.os }}-${{ env.FLUTTER_CHANNEL }}-${{ env.FLUTTER_VERSION }}-arm64-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          architecture: arm64
          cache: false

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no codesign - untuk distribusi internal/testing)
        run: |
          flutter build ios --release --no-codesign \
            --build-name=${{ needs.extract-changelog.outputs.version }} \
            --build-number=${{ github.run_number }} \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}

      - name: Package IPA
        run: |
          VERSION="${{ needs.extract-changelog.outputs.version }}"
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r tonztoon-v${VERSION}.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: frontend/tonztoon-v*.ipa
          retention-days: 7

  # ─────────────────────────────────────────────
  # JOB 4: Publish GitHub Release
  # ─────────────────────────────────────────────
  publish-release:
    name: 📦 Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [extract-changelog, build-android, build-ios]
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: ./release-assets/

      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: ./release-assets/

      - name: List release assets
        run: ls -la ./release-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "🎉 TonzToon ${{ github.ref_name }}"
          body: |
            ## 📋 Apa yang Baru di ${{ github.ref_name }}?

            ${{ needs.extract-changelog.outputs.release_notes }}

            ---

            ## 📥 Download

            | Platform | File | Keterangan |
            |----------|------|------------|
            | 🤖 Android | `tonztoon-${{ github.ref_name }}.apk` | Install langsung (enable Unknown Sources) |
            | 🍎 iOS | `tonztoon-${{ github.ref_name }}.ipa` | Perlu signing / AltStore / TestFlight |

            ---

            > **Build:** #${{ github.run_number }} • **Commit:** `${{ github.sha }}`
          files: ./release-assets/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          generate_release_notes: false

      - name: 🧾 Log release summary
        if: always()
        run: |
          set -euo pipefail

          version="${{ needs.extract-changelog.outputs.version }}"
          prerelease="false"
          if [[ "${GITHUB_REF_NAME}" == *-beta* || "${GITHUB_REF_NAME}" == *-rc* ]]; then
            prerelease="true"
          fi
          completed_at="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"

          {
            echo "## 🚀 Build & publish release summary"
            echo
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Tag | ${GITHUB_REF_NAME} |"
            echo "| Version | ${version} |"
            echo "| Prerelease | ${prerelease} |"
            echo "| Android artifact | tonztoon-v${version}.apk |"
            echo "| iOS artifact | tonztoon-v${version}.ipa |"
            echo "| Run number | ${GITHUB_RUN_NUMBER} |"
            echo "| Completed at | ${completed_at} |"
          } >> "$GITHUB_STEP_SUMMARY"
