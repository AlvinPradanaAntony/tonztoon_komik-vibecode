<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Dashboard admin TonzToon untuk meninjau dan memproses review serta laporan masalah pengguna."
    />
    <title>TonzToon Helpdesk Manager</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
    />
    <link rel="stylesheet" href="./admin-dashboard.css" />
    <script src="./admin-dashboard.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  </head>
  <body class="min-h-screen text-ink antialiased">
    <div id="appView" class="min-h-screen">
      <header
        data-admin-header
        data-eyebrow="Support Inbox"
        data-title="Kelola Helpdesk"
      >
        <template data-admin-actions>
          <a
            href="./index.html"
            class="inline-flex h-10 items-center gap-2 rounded-2xl border border-line bg-white/90 px-3 text-sm font-medium text-ink shadow-sm hover:bg-slate-50"
          >
            <i data-lucide="layout-dashboard" class="h-4 w-4"></i>
            <span>Dashboard</span>
          </a>
          <a
            href="./account-dashboard.html"
            class="inline-flex h-10 items-center gap-2 rounded-2xl border border-line bg-white/90 px-3 text-sm font-medium text-ink shadow-sm hover:bg-slate-50"
          >
            <i data-lucide="users" class="h-4 w-4"></i>
            <span>Akun</span>
          </a>
          <button
            id="reloadBtn"
            type="button"
            class="inline-flex h-10 items-center gap-2 rounded-2xl border border-line bg-white/90 px-3 text-sm font-medium text-ink shadow-sm hover:bg-slate-50"
          >
            <i data-lucide="refresh-cw" class="h-4 w-4"></i>
            <span>Reload</span>
          </button>
          <button
            id="logoutBtn"
            type="button"
            class="inline-flex h-10 items-center gap-2 rounded-2xl border border-line bg-white/90 px-3 text-sm font-medium text-ink shadow-sm hover:bg-slate-50"
          >
            <i data-lucide="log-out" class="h-4 w-4"></i>
            <span>Logout</span>
          </button>
        </template>
      </header>

      <main class="mx-auto max-w-7xl px-4 py-5 sm:px-6 lg:px-8">
        <section class="grid gap-3 sm:grid-cols-2 xl:grid-cols-5">
          <button
            type="button"
            data-summary-status=""
            class="summary-card glass-panel rounded-3xl border border-brand/30 p-4 text-left shadow-sm ring-2 ring-brand/10"
          >
            <span class="flex items-center justify-between gap-3">
              <span class="text-sm font-medium text-muted">Semua</span>
              <i data-lucide="inbox" class="h-4 w-4 text-brand"></i>
            </span>
            <strong id="totalCount" class="mt-2 block text-3xl font-semibold"
              >0</strong
            >
          </button>
          <button
            type="button"
            data-summary-status="open"
            class="summary-card glass-panel rounded-3xl border border-white/70 p-4 text-left shadow-sm"
          >
            <span class="flex items-center justify-between gap-3">
              <span class="text-sm font-medium text-muted">Open</span>
              <i data-lucide="circle-dot" class="h-4 w-4 text-amber-600"></i>
            </span>
            <strong id="openCount" class="mt-2 block text-3xl font-semibold"
              >0</strong
            >
          </button>
          <button
            type="button"
            data-summary-status="in_progress"
            class="summary-card glass-panel rounded-3xl border border-white/70 p-4 text-left shadow-sm"
          >
            <span class="flex items-center justify-between gap-3">
              <span class="text-sm font-medium text-muted">Diproses</span>
              <i data-lucide="loader-circle" class="h-4 w-4 text-blue-600"></i>
            </span>
            <strong id="progressCount" class="mt-2 block text-3xl font-semibold"
              >0</strong
            >
          </button>
          <button
            type="button"
            data-summary-status="resolved"
            class="summary-card glass-panel rounded-3xl border border-white/70 p-4 text-left shadow-sm"
          >
            <span class="flex items-center justify-between gap-3">
              <span class="text-sm font-medium text-muted">Resolved</span>
              <i
                data-lucide="circle-check-big"
                class="h-4 w-4 text-emerald-600"
              ></i>
            </span>
            <strong id="resolvedCount" class="mt-2 block text-3xl font-semibold"
              >0</strong
            >
          </button>
          <button
            type="button"
            data-summary-status="closed"
            class="summary-card glass-panel rounded-3xl border border-white/70 p-4 text-left shadow-sm"
          >
            <span class="flex items-center justify-between gap-3">
              <span class="text-sm font-medium text-muted">Closed</span>
              <i data-lucide="archive" class="h-4 w-4 text-slate-600"></i>
            </span>
            <strong id="closedCount" class="mt-2 block text-3xl font-semibold"
              >0</strong
            >
          </button>
        </section>

        <section class="mt-5 grid gap-5 lg:grid-cols-[minmax(0,1fr)_380px]">
          <div class="min-w-0">
            <div
              class="glass-panel overflow-hidden rounded-3xl border border-white/70 shadow-sm"
            >
              <div
                class="grid gap-3 border-b border-line/80 p-4 md:grid-cols-[minmax(220px,1fr)_170px_180px]"
              >
                <label class="relative block">
                  <span class="sr-only">Cari submission</span>
                  <i
                    data-lucide="search"
                    class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-muted"
                  ></i>
                  <input
                    id="searchInput"
                    type="search"
                    class="h-10 w-full rounded-2xl border border-line bg-white/90 pl-10 pr-3 text-sm outline-none focus:border-brand focus:ring-2 focus:ring-brand/20"
                    placeholder="Cari kode, judul, atau pesan"
                  />
                </label>
                <select
                  id="categoryFilter"
                  aria-label="Filter kategori helpdesk"
                  class="h-10 rounded-2xl border border-line bg-white/90 px-3 text-sm outline-none focus:border-brand focus:ring-2 focus:ring-brand/20"
                >
                  <option value="">Semua kategori</option>
                  <option value="review">Review</option>
                  <option value="report">Report</option>
                </select>
                <select
                  id="statusFilter"
                  aria-label="Filter status helpdesk"
                  class="h-10 rounded-2xl border border-line bg-white/90 px-3 text-sm outline-none focus:border-brand focus:ring-2 focus:ring-brand/20"
                >
                  <option value="">Semua status</option>
                  <option value="open">Open</option>
                  <option value="in_progress">Diproses</option>
                  <option value="resolved">Resolved</option>
                  <option value="closed">Closed</option>
                </select>
              </div>

              <div class="max-h-[38rem] overflow-auto scrollbar-thin">
                <table class="w-full min-w-[780px] divide-y divide-line">
                  <thead class="sticky top-0 z-10 bg-slate-50/95 backdrop-blur">
                    <tr>
                      <th
                        class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-muted"
                      >
                        Submission
                      </th>
                      <th
                        class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-muted"
                      >
                        Kategori
                      </th>
                      <th
                        class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-muted"
                      >
                        Status
                      </th>
                      <th
                        class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-muted"
                      >
                        Pengirim
                      </th>
                      <th
                        class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-muted"
                      >
                        Dibuat
                      </th>
                      <th
                        class="px-4 py-3 text-right text-xs font-semibold uppercase tracking-wide text-muted"
                      >
                        Aksi
                      </th>
                    </tr>
                  </thead>
                  <tbody
                    id="submissionsTable"
                    class="divide-y divide-line bg-white"
                  ></tbody>
                </table>
              </div>
              <div id="emptyState" class="hidden px-4 py-14 text-center">
                <i data-lucide="inbox" class="mx-auto h-9 w-9 text-muted"></i>
                <p class="mt-3 text-sm font-medium text-ink">
                  Belum ada submission yang cocok.
                </p>
                <p class="mt-1 text-xs text-muted">
                  Ubah filter atau muat ulang data.
                </p>
              </div>
              <div
                class="flex flex-col gap-3 border-t border-line/80 p-4 sm:flex-row sm:items-center sm:justify-between"
              >
                <p id="paginationSummary" class="text-sm text-muted">
                  0 submission
                </p>
                <div class="flex items-center gap-2">
                  <select
                    id="pageSizeSelect"
                    aria-label="Jumlah submission per halaman"
                    class="h-10 rounded-2xl border border-line bg-white/90 px-3 text-sm outline-none focus:border-brand focus:ring-2 focus:ring-brand/20"
                  >
                    <option value="25">25 / halaman</option>
                    <option value="50" selected>50 / halaman</option>
                    <option value="100">100 / halaman</option>
                  </select>
                  <button
                    id="prevPageBtn"
                    type="button"
                    class="inline-flex h-10 items-center gap-2 rounded-2xl border border-line bg-white/90 px-3 text-sm font-medium hover:bg-slate-50"
                  >
                    <i data-lucide="chevron-left" class="h-4 w-4"></i>
                    <span>Prev</span>
                  </button>
                  <button
                    id="nextPageBtn"
                    type="button"
                    class="inline-flex h-10 items-center gap-2 rounded-2xl border border-line bg-white/90 px-3 text-sm font-medium hover:bg-slate-50"
                  >
                    <span>Next</span>
                    <i data-lucide="chevron-right" class="h-4 w-4"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>

          <aside class="min-w-0">
            <div
              class="glass-panel sticky top-24 overflow-hidden rounded-3xl border border-white/70 shadow-soft"
            >
              <div class="border-b border-line/80 p-4">
                <div class="flex items-start justify-between gap-3">
                  <div class="min-w-0">
                    <p class="text-sm font-medium text-muted">
                      Detail submission
                    </p>
                    <h2
                      id="detailReference"
                      class="mt-1 truncate text-xl font-semibold"
                    >
                      Pilih submission
                    </h2>
                  </div>
                  <span
                    id="detailStatus"
                    class="shrink-0 rounded-full bg-slate-100 px-2.5 py-1 text-xs font-semibold text-slate-700"
                    >-</span
                  >
                </div>
                <p id="detailMeta" class="mt-1 text-xs text-muted">
                  Data lengkap akan tampil di sini.
                </p>
              </div>
              <div id="detailEmpty" class="p-8 text-center">
                <i
                  data-lucide="mouse-pointer-click"
                  class="mx-auto h-8 w-8 text-muted"
                ></i>
                <p class="mt-3 text-sm text-muted">
                  Pilih salah satu baris untuk mulai memproses.
                </p>
              </div>
              <form id="workflowForm" class="hidden">
                <div
                  id="detailContent"
                  class="max-h-[36rem] space-y-4 overflow-y-auto p-4 scrollbar-thin"
                ></div>
                <div class="border-t border-line/80 p-4">
                  <label class="block">
                    <span class="text-sm font-medium text-ink"
                      >Status workflow</span
                    >
                    <select
                      id="workflowStatusField"
                      class="mt-1 h-10 w-full rounded-2xl border border-line bg-white px-3 text-sm outline-none focus:border-brand focus:ring-2 focus:ring-brand/20"
                    >
                      <option value="open">Open</option>
                      <option value="in_progress">Diproses</option>
                      <option value="resolved">Resolved</option>
                      <option value="closed">Closed</option>
                    </select>
                  </label>
                  <label class="mt-3 block">
                    <span class="text-sm font-medium text-ink"
                      >Catatan admin</span
                    >
                    <textarea
                      id="adminNoteField"
                      maxlength="2000"
                      rows="5"
                      class="mt-1 w-full resize-y rounded-2xl border border-line bg-white px-3 py-2 text-sm leading-6 outline-none focus:border-brand focus:ring-2 focus:ring-brand/20"
                      placeholder="Tulis hasil investigasi atau tindak lanjut internal."
                    ></textarea>
                  </label>
                  <button
                    id="saveWorkflowBtn"
                    type="submit"
                    class="mt-4 inline-flex h-10 w-full items-center justify-center gap-2 rounded-2xl bg-brand px-4 text-sm font-semibold text-white hover:bg-teal-800"
                  >
                    <i data-lucide="save" class="h-4 w-4"></i>
                    <span>Simpan perubahan</span>
                  </button>
                </div>
              </form>
            </div>
          </aside>
        </section>
      </main>
    </div>
    <script src="./helpdesk-dashboard.js"></script>
  </body>
</html>
