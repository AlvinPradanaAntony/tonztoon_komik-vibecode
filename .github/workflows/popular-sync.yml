# ======================================================
# Tonztoon Komik — Popular Feed Sync GitHub Actions Workflow
# ======================================================
# Trigger:
#   1. Cron job populer (terjadwal harian)
#   2. workflow_dispatch manual untuk popular sync

name: "🔥 Scraper: Popular Sync"

on:
  schedule:
    # Jalankan 1x sehari di jam yang berbeda dari latest cron
    - cron: "30 1 * * *"

  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Source that triggered this workflow"
        required: false
        default: "manual"
      popular_pages:
        description: "Jumlah halaman popular yang ingin disinkronkan"
        required: false
        default: "10"
      source:
        description: "Optional scraper source to sync (empty = all sources)"
        required: false
        default: ""
      popular_no_early_stop:
        description: "Nonaktifkan early-stop untuk popular feed"
        required: false
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape-popular:
    name: Run Popular Feed Sync
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: 🖥️ Install virtual display
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.source == '' || github.event.inputs.source == 'all' || github.event.inputs.source == 'komiku_asia'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: 🌐 Install Scrapling browser dependencies
        run: scrapling install

      - name: 🔥 Run popular sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POPULAR_PAGES: ${{ github.event.inputs.popular_pages || '10' }}
          SCRAPER_SOURCE: ${{ github.event.inputs.source || '' }}
          POPULAR_NO_EARLY_STOP: ${{ github.event.inputs.popular_no_early_stop || 'false' }}
          KOMIKU_ASIA_HEADLESS: "false"
        run: |
          set -euo pipefail

          cd backend

          args=(--max-pages 0 --popular-pages "${POPULAR_PAGES}")

          if [ -n "${SCRAPER_SOURCE}" ] && [ "${SCRAPER_SOURCE}" != "all" ]; then
            args+=(--source "${SCRAPER_SOURCE}")
          fi

          if [ "${POPULAR_NO_EARLY_STOP}" = "true" ]; then
            args+=(--popular-no-early-stop)
          fi

          printf 'Running popular sync with args:'
          printf ' %q' "${args[@]}"
          printf '\n'

          if [ "${SCRAPER_SOURCE}" = "komiku_asia" ]; then
            echo "Running komiku_asia through xvfb."
            xvfb-run -a -s "-screen 0 1366x768x24" python -m scraper.main "${args[@]}"
          elif [ -z "${SCRAPER_SOURCE}" ] || [ "${SCRAPER_SOURCE}" = "all" ]; then
            echo "Running non-komiku_asia sources without xvfb."
            for source in komiku komikcast shinigami; do
              python -m scraper.main --source "${source}" "${args[@]}"
            done
            echo "Running komiku_asia through xvfb."
            xvfb-run -a -s "-screen 0 1366x768x24" python -m scraper.main --source komiku_asia "${args[@]}"
          else
            echo "komiku_asia is not included; running without xvfb."
            python -m scraper.main "${args[@]}"
          fi

      - name: 📝 Log completion
        if: always()
        env:
          TRIGGER_SOURCE: ${{ github.event.inputs.trigger_source || github.event_name }}
          POPULAR_PAGES: ${{ github.event.inputs.popular_pages || '10' }}
          SCRAPER_SOURCE: ${{ github.event.inputs.source || 'all' }}
          POPULAR_NO_EARLY_STOP: ${{ github.event.inputs.popular_no_early_stop || 'false' }}
        run: |
          set -euo pipefail

          completed_at="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"

          {
            echo "## 🔥 Popular sync summary"
            echo
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Trigger source | ${TRIGGER_SOURCE} |"
            echo "| Source | ${SCRAPER_SOURCE} |"
            echo "| Popular pages | ${POPULAR_PAGES} |"
            echo "| Popular no early-stop | ${POPULAR_NO_EARLY_STOP} |"
            echo "| Completed at | ${completed_at} |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Popular sync workflow finished at $(date -u)"
