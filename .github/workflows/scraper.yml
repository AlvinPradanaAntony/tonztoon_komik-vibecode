# ================================================
# Tonztoon Komik — Scraper GitHub Actions Workflow
# ================================================

name: "🕷️ Scraper: Latest Sync"

on:
  schedule:
    # Jalankan setiap 2 jam (00:00, 02:00, 04:00, 06:00, 08:00, 10:00, 12:00, 14:00, 16:00, 18:00, 20:00, 22:00 UTC)
    - cron: "0 */2 * * *"

  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Source that triggered this workflow"
        required: false
        default: "manual"
      source:
        description: "Optional scraper source to sync (empty = all sources)"
        required: false
        default: ""
      max_pages:
        description: "Latest pages to scan (0 disables latest feed)"
        required: false
        default: "10"
      early_stop:
        description: "Number of unchanged pages before stopping"
        required: false
        default: "3"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: scraper-push-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    name: Run Comic Scraper
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: 🖥️ Install virtual display
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.source == '' || github.event.inputs.source == 'all' || github.event.inputs.source == 'komiku_asia'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: 🌐 Install Scrapling browser dependencies
        run: scrapling install

      - name: 🔐 Validate configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
        run: |
          cd backend
          python -m scraper.validate_config

      - name: 🕷️ Run scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          SCRAPER_SOURCE: ${{ github.event.inputs.source || '' }}
          SCRAPER_MAX_PAGES: ${{ github.event.inputs.max_pages || '' }}
          SCRAPER_EARLY_STOP: ${{ github.event.inputs.early_stop || '' }}
          KOMIKU_ASIA_HEADLESS: "false"
          KOMIKU_ASIA_PROXY: ${{ secrets.KOMIKU_ASIA_PROXY }}
        run: |
          set +e
          {
            set -euo pipefail

            cd backend

            args=()
            if [ -n "${SCRAPER_SOURCE}" ] && [ "${SCRAPER_SOURCE}" != "all" ]; then
              args+=(--source "${SCRAPER_SOURCE}")
              if [[ "${SCRAPER_SOURCE}" == "komiku" || "${SCRAPER_SOURCE}" == "voratoon" || "${SCRAPER_SOURCE}" == "shinigami" ]]; then
                args+=(--no-anti-blocking)
              fi
            fi

            if [ -n "${SCRAPER_MAX_PAGES}" ]; then
              args+=(--max-pages "${SCRAPER_MAX_PAGES}")
            fi

            if [ -n "${SCRAPER_EARLY_STOP}" ]; then
              args+=(--early-stop "${SCRAPER_EARLY_STOP}")
            fi

            printf 'Running scraper with args:'
            printf ' %q' "${args[@]}"
            echo ""

            if [ "${SCRAPER_SOURCE}" = "komiku_asia" ]; then
              echo "Running komiku_asia through xvfb."
              xvfb-run -a -s "-screen 0 1366x768x24" python -m scraper.main "${args[@]}"
            elif [ -z "${SCRAPER_SOURCE}" ] || [ "${SCRAPER_SOURCE}" = "all" ]; then
              echo "Running non-komiku_asia sources without xvfb."
              for source in komiku voratoon shinigami; do
                echo "─── Source: ${source} ───"
                python -m scraper.main --source "${source}" --no-anti-blocking "${args[@]}" || {
                  echo "::warning::Scraper untuk source ${source} selesai dengan error."
                }
              done
              echo "─── Source: komiku_asia ───"
              echo "Running komiku_asia through xvfb."
              xvfb-run -a -s "-screen 0 1366x768x24" python -m scraper.main --source komiku_asia "${args[@]}" || {
                echo "::warning::Scraper untuk source komiku_asia selesai dengan error."
              }
            else
              echo "komiku_asia is not included; running without xvfb."
              python -m scraper.main "${args[@]}"
            fi
          } 2>&1 | tee scraper-latest.log
          status=${PIPESTATUS[0]}
          echo "${status}" > scraper-latest.status
          exit "${status}"

      - name: 📝 Write scraper summary
        if: always()
        run: |
          PYTHONPATH=backend python -m scraper.report_summary \
            --log-file scraper-latest.log \
            --status-file scraper-latest.status \
            --mode latest \
            --trigger-source "${{ github.event.inputs.trigger_source || github.event_name }}" \
            --source "${{ github.event.inputs.source || 'all' }}" \
            --max-pages "${{ github.event.inputs.max_pages || 'default' }}" \
            --early-stop "${{ github.event.inputs.early_stop || 'default' }}" >> "$GITHUB_STEP_SUMMARY"

      - name: 📎 Upload scraper log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-latest-log
          path: |
            scraper-latest.log
            backend/scraper-latest.log
          if-no-files-found: ignore
