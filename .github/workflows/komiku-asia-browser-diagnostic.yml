# ======================================================
# Tonztoon Komik — Komiku Asia Browser Diagnostic
# ======================================================
# Manual diagnostic untuk membandingkan Scrapling vs CloakBrowser.
# Workflow ini tidak menyentuh database; hanya fetch listing latest page.

name: "🧪 Komiku Asia Browser Diagnostic"

on:
  workflow_dispatch:
    inputs:
      engine:
        description: "Browser engine yang diuji"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - scrapling
          - cloakbrowser
      page:
        description: "Halaman latest Komiku Asia yang diuji"
        required: false
        default: "1"
      cloak_headless:
        description: "Uji CloakBrowser dengan headless=True"
        required: false
        default: false
        type: boolean
      cloak_challenge_timeout_ms:
        description: "Timeout khusus Cloudflare/CloakBrowser dalam milidetik"
        required: false
        default: "120000"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CLOAKBROWSER_CACHE_PATH: ~/.cloakbrowser

jobs:
  diagnose:
    name: Compare Browser Engines
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install cloakbrowser

      - name: 🗓️ Compute CloakBrowser cache key
        id: cloakbrowser-cache-key
        run: |
          set -euo pipefail
          week="$(date -u +'%G-W%V')"
          echo "week=${week}" >> "$GITHUB_OUTPUT"

      - name: 🧥 Restore CloakBrowser binary cache
        id: cloakbrowser-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CLOAKBROWSER_CACHE_PATH }}
          key: cloakbrowser-${{ runner.os }}-${{ runner.arch }}-py312-${{ steps.cloakbrowser-cache-key.outputs.week }}
          restore-keys: |
            cloakbrowser-${{ runner.os }}-${{ runner.arch }}-py312-
            cloakbrowser-${{ runner.os }}-${{ runner.arch }}-

      - name: 🖥️ Install virtual display and browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          python -m playwright install-deps chromium

      - name: 🌐 Install Scrapling browser dependencies
        run: scrapling install

      - name: 🧪 Run diagnostic
        env:
          ENGINE: ${{ github.event.inputs.engine || 'both' }}
          PAGE: ${{ github.event.inputs.page || '1' }}
          CLOAK_HEADLESS: ${{ github.event.inputs.cloak_headless || 'false' }}
          KOMIKU_ASIA_CLOAK_CHALLENGE_TIMEOUT_MS: ${{ github.event.inputs.cloak_challenge_timeout_ms || '120000' }}
        run: |
          set -euo pipefail
          cd backend

          CMD="python -m scraper.diagnose_komiku_asia_browser --engine ${ENGINE} --page ${PAGE} --debug-dir ../komiku-asia-debug"
          if [ "${CLOAK_HEADLESS}" = "true" ]; then
            CMD="${CMD} --cloak-headless"
          fi

          echo "Running: ${CMD}"
          set +e
          xvfb-run -a -s "-screen 0 1366x768x24" bash -lc "${CMD}" 2>&1 | tee ../komiku-asia-diagnostic.log
          status=${PIPESTATUS[0]}
          set -e
          echo "${status}" > ../komiku-asia-diagnostic.status
          exit "${status}"

      - name: 🔎 Check CloakBrowser cache path
        id: cloakbrowser-cache-path
        if: always()
        run: |
          set -euo pipefail
          if [ -d "${HOME}/.cloakbrowser" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            du -sh "${HOME}/.cloakbrowser" || true
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 💾 Save CloakBrowser binary cache
        if: always() && steps.cloakbrowser-cache.outputs.cache-hit != 'true' && steps.cloakbrowser-cache-path.outputs.exists == 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CLOAKBROWSER_CACHE_PATH }}
          key: cloakbrowser-${{ runner.os }}-${{ runner.arch }}-py312-${{ steps.cloakbrowser-cache-key.outputs.week }}

      - name: 📝 Write diagnostic summary
        if: always()
        env:
          ENGINE: ${{ github.event.inputs.engine || 'both' }}
          PAGE: ${{ github.event.inputs.page || '1' }}
          CLOAK_HEADLESS: ${{ github.event.inputs.cloak_headless || 'false' }}
          CLOAK_CHALLENGE_TIMEOUT_MS: ${{ github.event.inputs.cloak_challenge_timeout_ms || '120000' }}
        run: |
          set -euo pipefail

          completed_at="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          status="unknown"
          if [ -f komiku-asia-diagnostic.status ]; then
            status="$(cat komiku-asia-diagnostic.status)"
          fi

          if [ "${status}" = "0" ]; then
            conclusion="success"
          else
            conclusion="failed"
          fi

          {
            echo "## 🧪 Komiku Asia browser diagnostic"
            echo
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Engine | ${ENGINE} |"
            echo "| Page | ${PAGE} |"
            echo "| Cloak headless | ${CLOAK_HEADLESS} |"
            echo "| Cloak challenge timeout | ${CLOAK_CHALLENGE_TIMEOUT_MS} ms |"
            echo "| Exit status | ${status} (${conclusion}) |"
            echo "| Completed at | ${completed_at} |"
            echo

            if [ -f komiku-asia-diagnostic.log ]; then
              echo "### Result lines"
              echo
              echo '```text'
              grep -E "^(===|OK after|FAIL after|[0-9]+\. )" komiku-asia-diagnostic.log || true
              echo '```'
              echo

              if [ -d komiku-asia-debug ] && find komiku-asia-debug -type f | grep -q .; then
                echo "### Debug artifacts generated"
                echo
                echo '```text'
                find komiku-asia-debug -maxdepth 1 -type f -printf "%f\n" | sort
                echo '```'
                echo

                first_html="$(find komiku-asia-debug -maxdepth 1 -type f -name '*.html' | sort | head -n 1 || true)"
                if [ -n "${first_html}" ]; then
                  echo "### Debug HTML excerpt"
                  echo
                  echo '```text'
                  python - "$first_html" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          html = path.read_text(encoding="utf-8", errors="replace")
          title_match = re.search(r"<title[^>]*>(.*?)</title>", html, flags=re.I | re.S)
          title = re.sub(r"\s+", " ", title_match.group(1)).strip() if title_match else "<no title>"
          text = re.sub(r"<(script|style)[^>]*>.*?</\1>", " ", html, flags=re.I | re.S)
          text = re.sub(r"<[^>]+>", " ", text)
          text = re.sub(r"\s+", " ", text).strip()
          print(f"file: {path}")
          print(f"title: {title}")
          print()
          print(text[:1500] if text else "<no text extracted>")
          PY
                  echo '```'
                  echo
                fi
              fi

              echo "### Recent diagnostic log"
              echo
              echo '```text'
              tail -n 120 komiku-asia-diagnostic.log
              echo '```'
            else
              echo "No diagnostic log was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
