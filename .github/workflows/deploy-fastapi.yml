name: "🚀 Deploy Backend to Hugging Face"

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "Dockerfile"
      - ".dockerignore"
      - "README.md"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (preview only, do not push to Hugging Face)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: deploy-hf
  cancel-in-progress: false

permissions:
  contents: read

env:
  BACKEND_DIR: backend
  HF_README_HEADER: |
    ---
    title: TonzToon Komik API
    emoji: 📚
    colorFrom: indigo
    colorTo: purple
    sdk: docker
    app_port: 7860
    pinned: false
    license: mit
    short_description: REST API backend untuk aplikasi pembaca komik TonzToon
    ---
  # Nilai default DRY_RUN; di-override oleh input workflow_dispatch jika dijalankan manual
  DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: 🔎 Inspect triggering changes
        id: trigger-changes
        run: |
          set -euo pipefail

          before="${{ github.event.before || '' }}"
          after="${{ github.sha }}"

          if [ -n "${before}" ] && git cat-file -e "${before}^{commit}" 2>/dev/null; then
            range="${before}..${after}"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            range="HEAD^..HEAD"
          else
            range="HEAD"
          fi

          echo "🔎 Inspecting trigger range: ${range}"
          git diff --name-only "${range}" > trigger-changed-files.txt || true

          backend_count=$(grep -Ec '^(backend/|Dockerfile$|\.dockerignore$|README\.md$)' trigger-changed-files.txt || true)
          total_count=$(wc -l < trigger-changed-files.txt | tr -d ' ')
          commit_subject="$(git log -1 --pretty=%s)"

          echo "changed_total=${total_count}" >> "$GITHUB_OUTPUT"
          echo "backend_changed=${backend_count}" >> "$GITHUB_OUTPUT"
          {
            echo "commit_subject<<EOF"
            echo "${commit_subject}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Changed files:"
          sed 's#^#  - #' trigger-changed-files.txt || true

      - name: 🔎 Validate deployment prerequisites
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          set -euo pipefail

          fail() { echo "❌ $1"; exit 1; }

          echo "🔎 Memulai workflow deploy backend"
          echo "🧪 Dry run mode: ${DRY_RUN}"

          case "${DRY_RUN}" in
            true|false) ;;
            *) fail "Nilai dry_run tidak valid: ${DRY_RUN}" ;;
          esac

          [[ -d "${BACKEND_DIR}" ]] || fail "Folder ${BACKEND_DIR} tidak ditemukan"
          [[ -f Dockerfile ]] || fail "Dockerfile tidak ditemukan"
          [[ -f .dockerignore ]] || fail ".dockerignore tidak ditemukan"
          [[ -f README.md ]] || fail "README.md tidak ditemukan"

          if [ "${DRY_RUN}" = "true" ]; then
            echo "⚠️ Dry run aktif, sinkronisasi dan push akan dilewati"
          else
            [[ -n "${HF_TOKEN:-}" ]] || fail "Secret HF_TOKEN belum tersedia"
            [[ -n "${HF_SPACE:-}" ]] || fail "Secret HF_SPACE belum tersedia"
            echo "✅ Semua secret dan file wajib tersedia"
          fi

      - name: 🛠️ Setup Git identity
        run: |
          set -euo pipefail

          echo "🛠️ Mengatur identitas git untuk commit otomatis"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          echo "✅ Git identity sudah siap"

      - name: 📦 Prepare Hugging Face payload
        run: |
          set -euo pipefail

          echo "📦 Membersihkan payload lama"
          rm -rf hf-payload
          mkdir -p hf-payload

          echo "📦 Menyalin backend, Dockerfile, dan .dockerignore"
          cp -R "$BACKEND_DIR" hf-payload/backend
          cp Dockerfile .dockerignore hf-payload/

          echo "📝 Membangun README Hugging Face dengan header khusus"
          printf '%s\n\n' "$HF_README_HEADER" > hf-payload/README.md
          awk '
            NR == 1 && $0 == "---" { in_frontmatter = 1; next }
            in_frontmatter && $0 == "---" { in_frontmatter = 0; next }
            !in_frontmatter { print }
          ' README.md >> hf-payload/README.md

          echo "📋 Payload siap dikirim"
          find hf-payload -maxdepth 2 -type f | sort | sed 's#^#  - #'
          echo "✅ Payload berhasil disiapkan"

      - name: 🔍 Preview payload
        if: env.DRY_RUN == 'true'
        run: |
          set -euo pipefail

          echo "🔍 Preview mode aktif, tidak ada koneksi ke Hugging Face"
          echo "📦 Ukuran payload:"
          du -sh hf-payload | awk '{print "  - " $0}'
          echo "✅ Preview selesai"

      - name: 🚚 Sync payload to Hugging Face Space
        if: env.DRY_RUN != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          set -euo pipefail

          echo "🚚 Meng-clone Hugging Face Space: ${HF_SPACE}"
          git clone --depth 1 "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}.git" hf-space

          echo "🔄 Menyinkronkan payload ke ruang Hugging Face"
          rsync -a --delete --itemize-changes --exclude='.git' hf-payload/ hf-space/ | tee rsync.log

          cd hf-space
          git add -A
          echo "✅ Payload berhasil disinkronkan"

      - name: 🧾 Log rsync summary
        id: rsync-summary
        if: ${{ always() && env.DRY_RUN != 'true' }}
        run: |
          set -euo pipefail

          if [ ! -f rsync.log ]; then
            echo "⚠️ Rsync log tidak ditemukan"
            exit 0
          fi

          added=$(grep -c '^>f+++++++++' rsync.log || true)
          deleted=$(grep -c '^\*deleting ' rsync.log || true)
          changed=$(grep -Ec '^(>f|>d|cd|cL|cS|cD|h|\.d|\.f)' rsync.log || true)
          updated=$(grep -Ec '^>f[^+]' rsync.log || true)

          echo "🧾 Rsync summary"
          printf '  - added:   %s\n' "${added}"
          printf '  - updated: %s\n' "${updated}"
          printf '  - deleted: %s\n' "${deleted}"
          printf '  - changed: %s\n' "${changed}"
          echo "✅ Ringkasan rsync selesai"
          echo "added=${added}" >> "$GITHUB_OUTPUT"
          echo "updated=${updated}" >> "$GITHUB_OUTPUT"
          echo "deleted=${deleted}" >> "$GITHUB_OUTPUT"
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"

      - name: 📤 Push to Hugging Face
        id: push-hf
        if: env.DRY_RUN != 'true'
        working-directory: hf-space
        run: |
          set -euo pipefail

          if git diff --cached --quiet; then
            echo "⚠️ Tidak ada perubahan baru, push dilewati"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "commit_sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          commit_message="chore: update backend deploy files [$(date +'%Y-%m-%d')]"
          echo "📝 Membuat commit: ${commit_message}"
          git commit -m "${commit_message}"
          commit_sha="$(git rev-parse --short HEAD)"

          echo "🚀 Mendorong perubahan ke Hugging Face"
          git push origin main

          echo "✅ Push ke Hugging Face berhasil"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${commit_sha}" >> "$GITHUB_OUTPUT"

      - name: ✅ Log completion
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          RSYNC_ADDED: ${{ steps.rsync-summary.outputs.added || 'n/a' }}
          RSYNC_UPDATED: ${{ steps.rsync-summary.outputs.updated || 'n/a' }}
          RSYNC_DELETED: ${{ steps.rsync-summary.outputs.deleted || 'n/a' }}
          RSYNC_CHANGED: ${{ steps.rsync-summary.outputs.changed || 'n/a' }}
          HF_PUSHED: ${{ steps.push-hf.outputs.pushed || 'false' }}
          HF_COMMIT_SHA: ${{ steps.push-hf.outputs.commit_sha || '' }}
          TRIGGER_CHANGED_TOTAL: ${{ steps.trigger-changes.outputs.changed_total || 'n/a' }}
          TRIGGER_BACKEND_CHANGED: ${{ steps.trigger-changes.outputs.backend_changed || 'n/a' }}
          TRIGGER_COMMIT_SUBJECT: ${{ steps.trigger-changes.outputs.commit_subject || '' }}
        run: |
          set -euo pipefail

          completed_at="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          deploy_status="failed"
          if [ "${JOB_STATUS}" = "success" ]; then
            if [ "${DRY_RUN}" = "true" ]; then
              deploy_status="dry_run_preview"
            elif [ "${HF_PUSHED}" = "true" ]; then
              deploy_status="deployed"
            else
              deploy_status="no_payload_changes"
            fi
          fi

          {
            echo "## 🚀 Deploy backend summary"
            echo
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Deploy status | ${deploy_status} |"
            echo "| Dry run | ${DRY_RUN} |"
            echo "| Job status | ${JOB_STATUS} |"
            echo "| Trigger commit | ${GITHUB_SHA::7} |"
            echo "| Trigger message | ${TRIGGER_COMMIT_SUBJECT:-n/a} |"
            echo "| Trigger changed files | ${TRIGGER_CHANGED_TOTAL} |"
            echo "| Backend deploy-relevant files | ${TRIGGER_BACKEND_CHANGED} |"
            echo "| Hugging Face pushed | ${HF_PUSHED} |"
            echo "| Hugging Face commit | ${HF_COMMIT_SHA:-n/a} |"
            echo "| Rsync changed | ${RSYNC_CHANGED} |"
            echo "| Rsync added | ${RSYNC_ADDED} |"
            echo "| Rsync updated | ${RSYNC_UPDATED} |"
            echo "| Rsync deleted | ${RSYNC_DELETED} |"
            echo "| Completed at | ${completed_at} |"
            echo

            if [ -f trigger-changed-files.txt ]; then
              echo "### Trigger changed files"
              echo
              echo '```text'
              head -n 20 trigger-changed-files.txt
              total_lines="$(wc -l < trigger-changed-files.txt | tr -d ' ')"
              if [ "${total_lines}" -gt 20 ]; then
                echo "... and $((total_lines - 20)) more"
              fi
              echo '```'
              echo
            fi

            if [ -f rsync.log ]; then
              echo "### Payload changes"
              echo
              echo '```text'
              head -n 40 rsync.log
              total_rsync_lines="$(wc -l < rsync.log | tr -d ' ')"
              if [ "${total_rsync_lines}" -gt 40 ]; then
                echo "... and $((total_rsync_lines - 40)) more"
              fi
              echo '```'
              echo
            elif [ "${DRY_RUN}" = "true" ]; then
              echo "### Payload changes"
              echo
              echo "Dry run mode did not sync against Hugging Face, so rsync changes were not computed."
              echo
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "⏱️ Waktu selesai: $(date -u)"

          if [ "${DRY_RUN}" = "true" ]; then
            echo "✅ Workflow selesai dalam mode preview"
          else
            echo "✅ Workflow deploy selesai"
          fi
