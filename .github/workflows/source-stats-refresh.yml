# ======================================================
# Tonztoon Komik — Source Stats Refresh GitHub Workflow
# ======================================================

name: "📊 Source Stats Refresh"

on:
  schedule:
    - cron: "0 */4 * * *"

  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Source that triggered this workflow"
        required: false
        default: "manual"
      source:
        description: "Optional source filter (e.g. komiku_asia)"
        required: false
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  refresh-source-stats:
    name: Refresh Source Stats
    # Scrapling 0.4.7 uses Playwright 1.58, which does not support Ubuntu 26.04.
    runs-on: ubuntu-24.04

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: 🖥️ Install virtual display
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.source == '' || github.event.inputs.source == 'all' || github.event.inputs.source == 'komiku_asia'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: 🌐 Install Scrapling browser dependencies
        run: scrapling install

      - name: 🔐 Validate database configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd backend
          python -m scraper.validate_config --db-only

      - name: 📊 Refresh source stats
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SOURCE_FILTER: ${{ github.event.inputs.source || '' }}
          KOMIKU_ASIA_HEADLESS: "false"
          KOMIKU_ASIA_PROXY: ${{ secrets.KOMIKU_ASIA_PROXY }}
        run: |
          set +e
          {
            set -euo pipefail

            cd backend
            args=()
            if [ -n "${SOURCE_FILTER}" ] && [ "${SOURCE_FILTER}" != "all" ]; then
              args+=(--source "$SOURCE_FILTER")
            fi

            printf 'Running source stats refresh with args:'
            printf ' %q' "${args[@]}"
            echo ""

            echo "Running source stats refresh through xvfb..."
            xvfb-run -a -s "-screen 0 1366x768x24" python -m scraper.refresh_source_stats "${args[@]}"
          } 2>&1 | tee source-stats-refresh.log

          status=${PIPESTATUS[0]}
          echo "${status}" > source-stats-refresh.status
          exit "${status}"

      - name: 📝 Write source stats summary
        if: always()
        run: |
          PYTHONPATH=backend python -m scraper.report_summary \
            --log-file source-stats-refresh.log \
            --status-file source-stats-refresh.status \
            --mode stats \
            --trigger-source "${{ github.event.inputs.trigger_source || github.event_name }}" \
            --source "${{ github.event.inputs.source || '' }}" >> "$GITHUB_STEP_SUMMARY"

      - name: 📎 Upload source stats log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-stats-refresh-log
          path: |
            source-stats-refresh.log
            backend/source-stats-refresh.log
          if-no-files-found: ignore
